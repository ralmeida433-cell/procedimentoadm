<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}Assistente de PCD - PMMG{% endblock %}</title>
<style>
  :root {
    --azul: #1e40af;
    --azul-claro: #3b82f6;
    --verde: #15803d;
    --verde-claro: #22c55e;
    --fundo: #f4f7fb;
    --cartao: #ffffff;
    --texto: #1e293b;
    --texto-suave: #64748b;
    --borda: #e2e8f0;
    --erro: #dc2626;
    --erro-fundo: #fef2f2;
    --aviso: #b45309;
    --aviso-fundo: #fffbeb;
    --sucesso-fundo: #f0fdf4;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--fundo);
    color: var(--texto);
    margin: 0;
    padding: 0 0 4rem;
  }
  header.topo {
    background: linear-gradient(90deg, var(--azul), var(--azul-claro));
    color: #fff;
    padding: 1.1rem 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header.topo a { color: #fff; text-decoration: none; font-weight: 600; }
  header.topo h1 { font-size: 1.15rem; margin: 0; font-weight: 600; }
  main { max-width: 880px; margin: 2rem auto; padding: 0 1.5rem; }
  .cartao {
    background: var(--cartao);
    border: 1px solid var(--borda);
    border-radius: 12px;
    padding: 1.75rem;
    margin-bottom: 1.5rem;
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
  }
  h2 { margin-top: 0; color: var(--azul); }
  h3 { color: var(--texto); font-size: 1rem; margin-top: 1.75rem; border-top: 1px solid var(--borda); padding-top: 1rem; }
  .etapas { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: 1.5rem; font-size: .82rem; }
  .etapas span { padding: .3rem .7rem; border-radius: 999px; background: #e2e8f0; color: var(--texto-suave); }
  .etapas span.atual { background: var(--azul); color: #fff; font-weight: 600; }
  label { display: block; font-weight: 600; font-size: .88rem; margin: 1rem 0 .3rem; }
  label .opcional { font-weight: 400; color: var(--texto-suave); font-size: .78rem; }
  input[type=text], input[type=date], select, textarea {
    width: 100%; padding: .55rem .7rem; border: 1px solid var(--borda); border-radius: 8px;
    font-size: .95rem; font-family: inherit; background: #fff; color: var(--texto);
  }
  textarea { min-height: 5rem; resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--azul-claro); border-color: var(--azul-claro); }
  .btn {
    display: inline-block; padding: .65rem 1.4rem; border-radius: 8px; border: none;
    font-weight: 600; cursor: pointer; text-decoration: none; font-size: .95rem;
  }
  .btn-primario { background: var(--azul); color: #fff; }
  .btn-primario:hover { background: #1e3a8a; }
  .btn-sucesso { background: var(--verde); color: #fff; }
  .btn-sucesso:hover { background: #14532d; }
  .btn-secundario { background: #fff; color: var(--azul); border: 1px solid var(--azul); }
  .btn-perigo { background: var(--erro); color: #fff; }
  .btn-perigo:hover { background: #991b1b; }
  .acoes { margin-top: 1.5rem; display: flex; gap: .75rem; flex-wrap: wrap; align-items: center; }
  .caixa { border-radius: 10px; padding: 1rem 1.2rem; margin-bottom: 1rem; font-size: .92rem; }
  .caixa ul { margin: .4rem 0 0; padding-left: 1.2rem; }
  .caixa-erro { background: var(--erro-fundo); color: var(--erro); border: 1px solid #fecaca; }
  .caixa-aviso { background: var(--aviso-fundo); color: var(--aviso); border: 1px solid #fde68a; }
  .caixa-sucesso { background: var(--sucesso-fundo); color: #166534; border: 1px solid #bbf7d0; }
  .caixa-perigo { background: var(--erro-fundo); color: var(--erro); border: 2px solid var(--erro); }

  /* Botões pequenos de ação em linha (lista do painel) */
  .btn-mini {
    display: inline-block; padding: .25rem .65rem; border-radius: 6px; font-size: .78rem;
    font-weight: 600; text-decoration: none; border: 1px solid var(--borda); color: var(--texto-suave);
    background: #fff; margin-left: .35rem;
  }
  .btn-mini:hover { background: var(--fundo); }
  .btn-mini-perigo { color: var(--erro); border-color: #fecaca; }
  .btn-mini-perigo:hover { background: var(--erro-fundo); }
  .item-lista { display: flex; align-items: center; flex-wrap: wrap; gap: .3rem; }
  .item-lista .item-principal { flex: 1 1 auto; }
  table.previa { width: 100%; border-collapse: collapse; font-size: .92rem; }
  table.previa td { padding: .5rem .3rem; border-bottom: 1px solid var(--borda); vertical-align: top; }
  table.previa td:first-child { color: var(--texto-suave); width: 40%; }
  ul.documentos { list-style: none; padding: 0; }
  ul.documentos li { margin-bottom: .5rem; }
  ul.documentos a { color: var(--azul); font-weight: 600; text-decoration: none; }
  ul.documentos a:hover { text-decoration: underline; }
  /* Moldura de visualização de documento (prévia aproximada, não fiel ao Word) */
  .moldura-documento {
    background: #fff; border: 1px solid var(--borda); border-radius: 4px;
    box-shadow: 0 2px 10px rgba(15, 23, 42, 0.08);
    max-width: 780px; margin: 0 auto; padding: 3rem 3.5rem;
    color: #1a1a1a; font-family: Georgia, "Times New Roman", serif; font-size: .95rem;
    line-height: 1.55; overflow-x: auto;
  }
  .moldura-documento table { border-collapse: collapse; margin-bottom: 1rem; }
  .moldura-documento table td, .moldura-documento table th { padding: .3rem .5rem; vertical-align: top; border: none; }
  .moldura-documento img { max-width: 100%; }
  .moldura-documento p { margin: 0 0 .8rem; }
  .moldura-documento ol, .moldura-documento ul { margin: 0 0 .8rem 1.2rem; padding: 0; }
  .badge { display: inline-block; padding: .2rem .6rem; border-radius: 999px; font-size: .75rem; font-weight: 600; }
  .badge-concluido { background: var(--verde-claro); color: #063d1e; }
  .badge-andamento { background: #dbeafe; color: var(--azul); }

  /* Formulário agrupado */
  fieldset.grupo-campos {
    border: 1px solid var(--borda); border-radius: 10px;
    padding: .5rem 1.25rem 1.25rem; margin: 0 0 1.5rem;
  }
  fieldset.grupo-campos legend {
    padding: .2rem .7rem; font-weight: 700; font-size: .82rem;
    text-transform: uppercase; letter-spacing: .03em;
    color: var(--azul); background: #eff4ff; border: 1px solid var(--borda);
    border-radius: 999px;
  }
  .campo { margin-bottom: .25rem; }
  .obrig { color: var(--erro); font-weight: 700; margin-left: .15rem; }

  /* Tooltip de ajuda (balão) */
  .dica { position: relative; display: inline-block; margin-left: .35rem; vertical-align: middle; }
  .dica-icone {
    display: inline-flex; align-items: center; justify-content: center;
    width: 1.05rem; height: 1.05rem; border-radius: 50%;
    background: var(--azul-claro); color: #fff; font-size: .72rem; font-weight: 700;
    cursor: help; user-select: none;
  }
  .dica-texto {
    visibility: hidden; opacity: 0; transition: opacity .12s ease;
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: 150%; z-index: 20; width: max-content; max-width: 300px;
    background: #1e293b; color: #f8fafc; font-weight: 400; font-size: .8rem;
    line-height: 1.4; text-transform: none; letter-spacing: normal;
    padding: .55rem .7rem; border-radius: 8px;
    box-shadow: 0 4px 12px rgba(15,23,42,.25);
  }
  .dica-texto::after {
    content: ""; position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
    border: 6px solid transparent; border-top-color: #1e293b;
  }
  .dica:hover .dica-texto, .dica:focus .dica-texto, .dica:focus-within .dica-texto {
    visibility: visible; opacity: 1;
  }
</style>
</head>
<body>
<header class="topo">
  <a href="{{ url_for('pcd.dashboard') }}"><h1>Assistente de PCD - PMMG</h1></a>
  <div style="display:flex; gap:1.5rem; align-items:center;">
    <a href="{{ url_for('pcd.consultar') }}">Consultar MAPPA</a>
    <a href="{{ url_for('pcd.extrair') }}">Extrair de documento</a>
    <a href="{{ url_for('pcd.novo') }}">+ Novo PCD</a>
    {% if login_ativo %}<a href="{{ url_for('pcd.logout') }}">Sair</a>{% endif %}
  </div>
</header>
<main>
{% block conteudo %}{% endblock %}
</main>
</body>
</html>
